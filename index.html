<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quelqu'un sur place — Corentin Bezille</title>
<meta name="description" content="Le CV de Corentin Bezille sous forme de jeu : cinq postes, cinq méthodes, un incident à résoudre. Candidature Forward Deployed Engineer.">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0B0E11">

<meta property="og:title" content="Quelqu'un sur place">
<meta property="og:description" content="Un CV qui se joue. Cinq postes, cinq méthodes, un incident à résoudre à 02:14.">
<meta property="og:type" content="website">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Archivo:wght@600;700&display=swap">

<style>
:root{
  --fond:#0B0E11; --panneau:#11161B; --ligne:#2B3843;
  --texte:#C8D3DA; --texte2:#7A8A96; --sonde:#FFB454; --trace:#46E6C8;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --sans:"Archivo",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--fond);color:var(--texte);
  font-family:var(--mono);font-size:14px;line-height:1.5;
  overflow:hidden;-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
a{color:var(--sonde)}

/* ---- barre ---- */
.bar{
  display:flex;align-items:center;gap:14px;flex:none;
  padding:9px 14px;border-bottom:1px solid var(--ligne);background:var(--panneau);
}
.bar h1{
  font-family:var(--sans);font-size:14px;font-weight:700;margin:0;letter-spacing:.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.bar h1 em{font-style:normal;color:var(--texte2);font-weight:600}
.bar .sp{flex:1}
.bar a,.bar button{
  font:600 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;
  color:var(--texte);background:transparent;border:1px solid var(--ligne);
  border-radius:2px;padding:7px 11px;cursor:pointer;text-decoration:none;white-space:nowrap;
}
.bar a:hover,.bar button:hover{border-color:var(--sonde);color:var(--sonde)}
.bar a.fort{background:var(--sonde);border-color:var(--sonde);color:#0B0E11}
.bar a.fort:hover{opacity:.88;color:#0B0E11}

/* ---- scène ---- */
.scene{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;position:relative;background:#07090B}
canvas{display:block;image-rendering:pixelated;outline:none}
canvas:focus-visible{box-shadow:0 0 0 2px var(--sonde)}

/* ---- aide clavier ---- */
.aide{
  flex:none;display:flex;gap:18px;flex-wrap:wrap;justify-content:center;
  padding:8px 14px;border-top:1px solid var(--ligne);
  font-size:11px;color:var(--texte2);letter-spacing:.04em;
}
.aide b{color:var(--texte);font-weight:500}
.aide kbd{
  font:500 10px/1 var(--mono);border:1px solid var(--ligne);border-radius:2px;
  padding:3px 5px;color:var(--texte);background:#0E1318;
}

/* ---- pad tactile ---- */
#pad{display:none;flex:none;height:112px;position:relative;touch-action:none;border-top:1px solid var(--ligne)}
#pad .z{position:absolute;border:1px solid var(--ligne);border-radius:4px;
  display:flex;align-items:center;justify-content:center;
  font:600 11px/1 var(--mono);letter-spacing:.08em;color:var(--texte2);background:#0E1318}
#pad .gauche{left:10px;right:50%;top:8px;bottom:8px;margin-right:6px}
#pad .saut{right:10px;width:104px;bottom:8px;height:52px}
#pad .tr{right:10px;width:104px;top:8px;height:44px}
@media (pointer:coarse){ #pad{display:block} .aide{display:none} }

/* ---- carte de relevé ---- */
#releve{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(5,7,10,.78);z-index:20;padding:20px}
#releve[hidden]{display:none}
.rel-in{
  background:var(--panneau);border:1px solid var(--ligne);border-left:3px solid var(--acc,var(--sonde));
  border-radius:3px;max-width:560px;width:100%;padding:22px 24px;
}
.rel-k{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc,var(--sonde));margin:0 0 10px}
.rel-in h2{font-family:var(--sans);font-size:19px;margin:0 0 2px;letter-spacing:-.01em}
.rel-in h2 span{font-family:var(--mono);font-size:12px;font-weight:400;color:var(--texte2);margin-left:8px}
.rel-p{color:var(--texte2);font-size:12.5px;margin:0 0 14px}
.rel-in p{margin:0 0 12px;font-size:13.5px;line-height:1.62}
.rel-w{border-top:1px solid var(--ligne);padding-top:12px;color:var(--texte2)}
.rel-w b{color:var(--texte)}
.rel-b{
  font:600 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;
  background:var(--acc,var(--sonde));color:#0B0E11;border:0;border-radius:2px;
  padding:11px 18px;cursor:pointer;margin-top:4px;
}
.rel-b:hover{opacity:.88}

/* ---- repli sans JavaScript ou sans canvas ---- */
#repli{padding:28px 20px;text-align:center;color:var(--texte2);max-width:560px;margin:auto}
#repli h2{font-family:var(--sans);color:var(--texte);font-size:18px;margin:0 0 10px}

@media (max-width:560px){ .bar h1 em{display:none} }
</style>
</head>
<body>

<header class="bar">
  <h1>Quelqu'un sur place <em>— le CV de Corentin Bezille, en jeu</em></h1>
  <span class="sp"></span>
  <button id="btn-dossier" type="button">Dossier</button>
  <a href="cv.html">CV</a>
  <a class="fort" href="mailto:corentin.bezille1756@gmail.com?subject=Forward%20Deployed%20Engineer">Écrire</a>
</header>

<div class="scene">
  <canvas id="jeu" width="480" height="270" aria-label="Jeu de plateforme. Le contenu du CV est aussi lisible dans le dossier."></canvas>
  <noscript>
    <div id="repli">
      <h2>Le jeu a besoin de JavaScript</h2>
      <p>Tout le contenu est lisible sans lui : <a href="dossier.html">ouvrir le dossier</a>
      ou <a href="cv.html">le CV</a>.</p>
    </div>
  </noscript>
</div>

<div id="pad" aria-hidden="true">
  <div class="z gauche">déplacer</div>
  <div class="z tr">trace</div>
  <div class="z saut">saut · impulsion</div>
</div>

<div class="aide">
  <span><kbd>←</kbd><kbd>→</kbd> <b>avancer</b></span>
  <span><kbd>Espace</kbd> <b>sauter</b>, puis à nouveau en l'air : <b>impulsion</b></span>
  <span><kbd>Maj</kbd> <b>lire les journaux</b></span>
  <span><kbd>Échap</kbd> <b>retour</b></span>
  <span><kbd>Maj</kbd>+<kbd>D</kbd> <b>dossier</b></span>
</div>

<div id="releve" hidden tabindex="-1"></div>

<script type="module" src="src/main.js"></script>
</body>
</html>
