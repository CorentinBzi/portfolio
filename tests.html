<!doctype html><html lang="fr"><head><meta charset="utf-8">
<title>Recette — Quelqu'un sur place</title>
<style>body{background:#0B0E11;color:#C8D3DA;font:13px/1.6 ui-monospace,monospace;padding:20px}
.ok{color:#6FCF8E}.ko{color:#E8503A}h1{font-size:15px}</style></head><body>
<h1>Recette automatique</h1><pre id="out">…</pre>
<canvas id="jeu" width="480" height="270" hidden></canvas>
<div id="pad" hidden></div><div id="releve" hidden></div>
<button id="btn-dossier" hidden></button>
<script type="module">
import { NIVEAUX } from './src/levels/index.js';
import { creerNiveau } from './src/game.js';
import { valide } from './src/levels/_contrat.js';
import { CLES } from './src/cv.js';

const B = { GAUCHE:1, DROITE:2, SAUT:4, TRACE:8, BAS:16, PAUSE:32 };
const out = [];
const app = { etat:{faits:[],modules:[]}, finNiveau(){ app.__fini = true; } };

function faux(bits, fronts){
  return { tenu:b=>(bits&b)!==0, appuye:b=>(fronts&b)!==0, relache:()=>false };
}

// Un « joueur » rustique : court à droite, saute quand il bute ou tombe,
// déclenche une impulsion peu après chaque saut, et lit les journaux
// par intermittence. S'il finit le niveau, un humain le finira aussi.
function joue(def, pas = 4200){
  const sc = creerNiveau(app, def);
  if (sc.erreur) return { id:def.id, erreur:sc.erreur };
  const c = sc.ctx;
  let bloque = 0, dernierX = 0, sauts = 0, maxX = 0;
  app.__fini = false;
  for (let i = 0; i < pas && !sc.fini; i++){
    const x = c.sonde.box.x;
    maxX = Math.max(maxX, x);
    if (Math.abs(x - dernierX) < 0.3) bloque++; else bloque = 0;
    dernierX = x;
    let bits = B.DROITE, fronts = 0;
    const s0 = c.sonde;
    const pieds = Math.floor((s0.box.y + s0.box.h + 1) / 16);
    const devant = Math.floor((s0.box.x + s0.box.w + 6) / 16);
    // le sol manque-t-il devant, sur deux tuiles ?
    const trou = c.carte.at(devant, pieds) === 0 && c.carte.at(devant + 1, pieds) === 0;
    // une marche est-elle a monter juste devant ?
    const marche = c.carte.at(devant, pieds - 1) !== 0 || c.carte.at(devant, pieds - 2) !== 0;
    // un joueur lit les journaux quand le sol manque : le robot fait pareil
    if (trou || !s0.sol) bits |= B.TRACE;
    if (s0.sol && (trou || marche || bloque > 4)) { fronts |= B.SAUT; sauts++; }
    if (!s0.sol && s0.impulsion && s0.cible) fronts |= B.SAUT;
    else if (!s0.sol && s0.impulsion && s0.vy > 1.3) { fronts |= B.SAUT; sauts++; }
    sc.pas(faux(bits, fronts));
  }
  return {
    id: def.id, fini: sc.fini, sauts,
    avance: Math.round(maxX / 16) + '/' + c.carte.w + ' tuiles',
    cibles: c.cibles.filter(t=>t.fait).length + '/' + c.cibles.length,
  };
}

function ligne(ok, txt){ out.push(`<span class="${ok?'ok':'ko'}">${ok?'PASS':'FAIL'}</span>  ${txt}`); }

// 1. chaque niveau passe le validateur
for (const n of NIVEAUX){
  const e = valide(n);
  ligne(e.length===0, `validateur — ${n.id}${e.length?' :: '+e.join(' · '):''}`);
}
// 2. chaque factKey existe
for (const n of NIVEAUX) ligne(CLES.includes(n.factKey), `fait de CV existant — ${n.id} → ${n.factKey}`);
// 3. chaque niveau est franchissable par un joueur rustique
for (const n of NIVEAUX){
  const r = joue(n);
  ligne(!!r.fini, `franchissable — ${n.id} :: ${r.erreur || (r.avance+', cibles '+r.cibles+', '+r.sauts+' sauts')}`);
}
document.getElementById('out').innerHTML = out.join('\n');
window.__recette = out.join('\n');
</script></body></html>
